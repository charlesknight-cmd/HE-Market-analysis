# nginx reverse-proxy config for the HE Job Market dashboard.
#
# Deploys to: /etc/nginx/sites-available/he-dashboard
# Enable with:
#   ln -s /etc/nginx/sites-available/he-dashboard /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Then obtain a free TLS certificate:
#   certbot --nginx -d jobs.charlesknight.co.uk
#
# DNS prerequisite: an A record pointing jobs.charlesknight.co.uk → server IP
# (set to "DNS only" / grey cloud in Cloudflare — not proxied).

server {
    listen 80;
    server_name jobs.charlesknight.co.uk;

    location / {
        proxy_pass         http://localhost:8501;
        proxy_http_version 1.1;

        # Required for Streamlit's WebSocket connection
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_read_timeout 86400;
    }
}
